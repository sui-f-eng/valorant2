<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0e12" />
    <title>VAL 触控练枪场</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="game-canvas" aria-label="游戏画布"></canvas>

    <div id="hud">
      <div class="hud-block">
        <span class="hud-label">分数</span>
        <span id="hud-score" class="hud-value accent">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">命中率</span>
        <span id="hud-acc" class="hud-value">—</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">剩余时间</span>
        <span id="hud-time" class="hud-value">30s</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">连击</span>
        <span id="hud-combo" class="hud-value combo">—</span>
      </div>
    </div>

    <p id="zone-hint">
      左半屏射击 · 右半屏滑动移动视角；<strong>准星固定在屏幕中心</strong>，把球滑到准星下再开火
    </p>

    <div id="toast" role="status" aria-live="polite"></div>

    <div id="overlay">
      <div class="panel" id="panel-menu">
        <h1>触控练枪场</h1>
        <p class="sub">
          准星始终在画面正中央；右手滑动平移场景，把靶子对准中心后左手开火。静态 / 移动 / 反应靶，内圈爆头。
        </p>

        <div class="controls-row">
          <label for="sensitivity">视角移动倍率（建议 0.5–1.5）</label>
          <input
            id="sensitivity"
            type="range"
            min="50"
            max="150"
            value="100"
          />
          <div id="sensitivity-val" class="range-value">1.00</div>
        </div>
        <div class="controls-row">
          <label for="precision">精瞄辅助（小幅滑动更慢，0=关闭）</label>
          <input id="precision" type="range" min="0" max="100" value="90" />
          <div id="precision-val" class="range-value">0.90</div>
        </div>
        <div class="controls-row">
          <label for="recoil">后坐力强度</label>
          <input id="recoil" type="range" min="0" max="200" value="100" />
          <div id="recoil-val" class="range-value">1.00</div>
        </div>

        <p id="best-score" class="best-score">
          最高分：<strong>0</strong>（本地）
        </p>

        <div class="btn-row">
          <button type="button" class="primary" id="btn-start">开始</button>
        </div>
      </div>

      <div class="panel hidden" id="panel-end">
        <h1 id="end-title">回合结束</h1>
        <p class="sub" id="end-detail"></p>
        <div class="btn-row">
          <button type="button" class="primary" id="btn-restart">
            重新开始
          </button>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
